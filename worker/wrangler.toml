name = "patchs-world"
compatibility_date = "2026-10-01"
main = "index.mjs"
workers_dev = false

# Its own address. The company website still forwards containedevolution.com/patch* here, which moves to it.
routes = [{ pattern = "patch.containedevolution.com", custom_domain = true }]

[assets]
directory = "../world/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Web Push public key. Its private half is the VAPID_PRIVATE_KEY secret.
[vars]
PATCH_CRAB_FACEBOOK_PUBLISHED = "true"
PATCH_X_CLIENT_ID = "VDB2RW5rZEd3UTBLazRkZ2hwNlM6MTpjaQ"
VAPID_PUBLIC_KEY = "BNgbQ0CDOxGp2lu2AYN_pCj9Cate9SuCI8gLBP8pJUAlfQzHEDZ-M2h-oZMPhqBzGgo7_UgoQ5P2DPab4sLqJFU"

# Patch's ElevenLabs voice and the most characters a month it may use. The key is the ELEVENLABS_API_KEY secret.
VOICE_ID = ""
VOICE_CHARACTERS_A_MONTH = "30000"

[[durable_objects.bindings]]
name = "PATCH_WORLD"
class_name = "PatchWorld"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PatchWorld"]

[[services]]
binding = "AUTH_SERVICE"
service = "ce-auth-candidate"

[[durable_objects.bindings]]
name = "SOCIAL_PUBLISHER"
class_name = "SocialPublisher"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SocialPublisher"]
