name = "patchs-world"
compatibility_date = "2026-10-01"
main = "index.mjs"
workers_dev = false

# Its own address. The company website still forwards containedevolution.com/patch* here, which moves to it.
routes = [{ pattern = "patch.containedevolution.com", custom_domain = true }]

[assets]
directory = "../world/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# Web Push public key. Its private half is the VAPID_PRIVATE_KEY secret.
[vars]
VAPID_PUBLIC_KEY = "BNgbQ0CDOxGp2lu2AYN_pCj9Cate9SuCI8gLBP8pJUAlfQzHEDZ-M2h-oZMPhqBzGgo7_UgoQ5P2DPab4sLqJFU"

[[durable_objects.bindings]]
name = "PATCH_WORLD"
class_name = "PatchWorld"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PatchWorld"]

[[services]]
binding = "AUTH_SERVICE"
service = "ce-auth-candidate"
