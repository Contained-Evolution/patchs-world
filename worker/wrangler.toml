name = "patchs-world"
compatibility_date = "2026-10-01"
main = "index.mjs"
workers_dev = false

# The company website forwards /patch* through a service binding.

[assets]
directory = "../world/dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

[[durable_objects.bindings]]
name = "PATCH_WORLD"
class_name = "PatchWorld"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PatchWorld"]

[[services]]
binding = "AUTH_SERVICE"
service = "ce-auth-candidate"
