<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173c38">
  <title>Leave a Gift for Patch</title>
  <link rel="stylesheet" href="./visits.css">
</head>
<body>
  <main>
    <nav aria-label="Patch’s World"><a href="./">← Island</a><a href="./journal.html">Journal</a></nav>
    <h1>Camp Drop-off</h1>
    <p>Leave something for Patch to find when he’s back at camp.</p>
    <div class="gifts">
      <article>
        <div class="gift-art banana" aria-hidden="true">🍌</div>
        <h2>Banana</h2>
        <p>A free meal you can leave once a day.</p>
        <p id="meal-state"></p>
        <button type="button" id="send-meal" disabled>Leave a banana</button>
      </article>
      <article>
        <div class="gift-art ball-stage" aria-hidden="true"><div class="ball"></div></div>
        <h2>Bouncy ball</h2>
        <p>A free toy Patch can play with again. Over about a month, it gets scuffed and loses its bounce.</p>
        <p id="ball-state"></p>
        <button type="button" id="send-ball" disabled>Leave a ball</button>
        <button type="button" id="preview-ball">See its bounce</button>
      </article>
    </div>
    <p id="status" role="status">Checking your gifts…</p>
    <a href="https://containedevolution.com/" id="sign-in" hidden>Sign in to leave a gift</a>
  </main>
  <script type="module" src="./gifts.js"></script>
</body>
</html>
